name: Safety SCA Scan

on: [push, pull_request]

jobs:
  oast-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Safety
        run: pip install safety

      - name: Run Safety Check (Allow Failure)
        # The lab notes: "allow the job to fail even when the tool found several issues"
        continue-on-error: true 
        #run: safety check -r requirements.txt
        # Legacy Syntax (Deprecated)
# - run: safety check -r requirements.txt

# Modern Standard (Recommended)
- name: Execute Software Composition Analysis
  run: safety scan
